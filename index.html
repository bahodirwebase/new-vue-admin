<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Byxora - Modern Admin Dashboard Template</title>
    <meta name="description" content="Byxora is a powerful and clean Admin Dashboard template built with Vue 3, Vite, and Naive UI." />
    <meta name="keywords" content="admin dashboard, vue 3, naive ui, vite, responsive, charts" />
    <meta name="author" content="Byxora Team" />

    <!-- Preload critical font subsets -->
    <link rel="preload" href="/src/assets/fonts/inter/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/poppins/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Inline critical styles: prevent flash of unstyled content before JS -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { background: #f8fafc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #app-shell {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      #app-shell.hide { opacity: 0; pointer-events: none; }
      .shell-spinner {
        width: 36px; height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Shell visible immediately on HTML parse — removed by Vue after mount -->
    <div id="app-shell"><div class="shell-spinner"></div></div>

    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
